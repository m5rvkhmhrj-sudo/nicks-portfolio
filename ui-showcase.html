<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nick's Portfolio · UI Directions</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090a0d;color:#f6f6f3;font-family:"Avenir Next",system-ui,sans-serif}header{padding:52px 5vw 26px;display:flex;align-items:end;justify-content:space-between;gap:28px}p{margin:0;color:#898d99;font-size:13px;letter-spacing:.12em;text-transform:uppercase}h1{margin:7px 0 0;font-size:clamp(34px,5vw,68px);line-height:.96;letter-spacing:-.055em}.hint{max-width:370px;color:#a6a9b1;font-size:14px;line-height:1.55;text-transform:none;letter-spacing:0}.gallery{display:grid;grid-template-columns:repeat(3,minmax(320px,1fr));gap:28px;padding:24px 5vw 70px}.option{min-width:0}.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.meta b{font-size:15px}.meta span{font-size:12px;color:#747986}.shell{position:relative;height:min(74vh,844px);min-height:620px;border-radius:30px;overflow:hidden;background:#111;box-shadow:0 24px 70px rgba(0,0,0,.4);transition:transform .7s cubic-bezier(.22,1,.36,1)}.shell:hover{transform:translateY(-7px)}iframe{width:390px;height:844px;border:0;display:block;transform-origin:top left}.open{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.62);color:#fff;text-decoration:none;font-size:18px;z-index:2}@media(max-width:1100px){.gallery{grid-template-columns:repeat(2,minmax(320px,1fr))}}@media(max-width:720px){header{align-items:start;flex-direction:column;padding-top:34px}.gallery{grid-template-columns:1fr;padding-left:16px;padding-right:16px}.shell{height:720px}}
</style>
</head>
<body>
<header><div><p>Visual exploration · 3 directions</p><h1>Nick's Portfolio</h1></div><div class="hint">Every direction uses the same portfolio data and working app. Open any version to test its full screen flow.</div></header>
<main class="gallery">
  <section class="option"><div class="meta"><b>01 · Obsidian</b><span>Dimensional / premium</span></div><div class="shell"><a class="open" href="index.html?ui=obsidian&fit" target="_blank" aria-label="Open Obsidian">↗</a><iframe title="Obsidian UI" src="index.html?ui=obsidian&fit"></iframe></div></section>
  <section class="option"><div class="meta"><b>02 · Ledger</b><span>Editorial / warm</span></div><div class="shell"><a class="open" href="index.html?ui=ledger&fit" target="_blank" aria-label="Open Ledger">↗</a><iframe title="Ledger UI" src="index.html?ui=ledger&fit"></iframe></div></section>
  <section class="option"><div class="meta"><b>03 · Signal</b><span>Technical / focused</span></div><div class="shell"><a class="open" href="index.html?ui=signal&fit" target="_blank" aria-label="Open Signal">↗</a><iframe title="Signal UI" src="index.html?ui=signal&fit"></iframe></div></section>
</main>
<script>function size(){document.querySelectorAll('.shell').forEach(s=>{const f=s.querySelector('iframe'),scale=Math.min(s.clientWidth/390,s.clientHeight/844);f.style.transform=`scale(${scale})`;f.style.marginLeft=`${(s.clientWidth-390*scale)/2}px`})}addEventListener('resize',size);size()</script>
</body>
</html>
